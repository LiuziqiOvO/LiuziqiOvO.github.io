# Butterfly 主题配置

# Anthropic-style redesign branch: keep Butterfly structure, remove image-heavy chrome.

# 导航菜单配置
nav:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  # 友链: /links/ || fas fa-link
  # 搜索: /search/ || fas fa-search
  关于: /about/ || fas fa-heart

# 网站图标和头像
favicon: /img/favicon.svg
avatar:
  img: /img/头像.jpg
  effect: false

# 网站背景
background: "#f5f1e8"

# 顶部图
disable_top_img: false
index_top_img_height: 58vh
index_img: "linear-gradient(180deg, #f5f1e8 0%, #eee7dc 100%)"
default_top_img: false
archive_img: false
tag_img: false
category_img: false
footer_img: false

cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
  default_cover:

index_layout: 4

subtitle:
  enable: true
  effect: false
  source: false
  sub:
    - Systems, Storage, and Engineering Notes

# 主页文章节选
index_post_content:
  method: 3
  length: 600
  excerpt_all: true

# 侧边栏设置
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: '已被AI夺舍之人'
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/Ozqi
  card_announcement:
    enable: true
    content: 这里整理系统、数据库、存储和性能分析相关的学习笔记，也记录工程实践中的取舍与复盘。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random

# 文章目录设置
toc:
  enable: true
  number: true
  style_simple: false

# 代码块设置
highlight_theme: mac
code_word_wrap: true
highlight_copy: true
highlight_lang: true

# 主题色配置
theme_color:
  enable: true
  main: "#141413"
  paginator: "#cc785c"
  button_hover: "#cc785c"
  text_selection: "#cc785c"
  link_color: "#9f4f37"
  meta_color: "#6f6b61"
  hr_color: "#d8d0c2"
  code_foreground: "#7c3729"
  code_background: "#eee7dc"
  toc_color: "#9f4f37"
  blockquote_padding_color: "#cc785c"
  blockquote_background_color: "#eee7dc"
  scrollbar_color: "#cc785c"
  meta_theme_color_light: "#f5f1e8"
  meta_theme_color_dark: "#141413"

# 社交链接
social:
  "fab fa-github": "https://github.com/Ozqi || GitHub"
  "fas fa-envelope": "mailto:1021578619@qq.com || Email"
  "fas fa-phone": "tel:15590245647 || Phone"
  "fab fa-weixin": "/about/ || WeChat: 15590245647"

# 页脚设置
footer:
  owner:
    enable: true
    since: 2024
  custom_text: Built for notes that can be revisited.
  copyright: true

# 文章版权声明
post_copyright:
  enable: true
  decode: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 评论系统
comments:
  use: false

# 访问统计
# 关闭 Busuanzi 默认站点统计，避免出现不可信的访客数/浏览量。
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# 页面加载动画
preloader: true

# 图片预览
fancybox: true

# 网页特效
butterfly_article_double_row: true
activate_power_mode: false
fireworks:
  enable: false
  zIndex: 9999
  mobile: false

# 页面动画效果
pacman:
  enable: false
canvas_ribbon:
  enable: false
  size: 150
  alpha: 0.6
  zIndex: -1
  click_to_change: true
  mobile: false

# 搜索功能（Butterfly 5.5 格式）
search:
  use: local_search
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: true
      hitsPerPage: 8
    CDN:

# 右下角按钮
rightside:
  enable: true
  hide_threshold: 500
  show_percent: true
  total_progress: true

# 阅读模式
readmode: true

# 夜间模式
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# 项目本地样式注入：只加载 source/css/custom.css，不修改主题包源码
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
